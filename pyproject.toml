[project]
name = "nfl-season-projections"
version = "0.1.0"
description = "Season-long NFL player projections, game by game, from observed data and transparent formulas"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
